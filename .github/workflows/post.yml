name: Publicar no Instagram da Focomob

on:
  schedule:
    # Pontualidade: o agendador do GitHub atrasa e perde execuções. Por isso, antes de cada horário de postagem
    # (segunda, quarta e sexta, 12h de Fortaleza = 15:00 UTC) há vários gatilhos redundantes; o poster.py espera
    # até o horário exato (WAIT_MIN). Nos outros dias e horários, confere a cada 15 min (minutos fora do pico).
    - cron: "20 14 * * 1,3,5"
    - cron: "40 14 * * 1,3,5"
    - cron: "52 14 * * 1,3,5"
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {} # permite rodar na hora pela aba Actions

concurrency: publicar # nunca duas execuções ao mesmo tempo (evita publicar em duplicidade)

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python poster.py
        env:
          WAIT_MIN: "40"
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      - name: Salvar estado das publicações
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Atualiza estado das publicações"
          git push
